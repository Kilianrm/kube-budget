# ============================================================
# Namespace
# ============================================================
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring-demo
  labels:
    environment: local
    purpose: monitoring-test
---
# ============================================================
# ConfigMap
# ============================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: demo-app-config
  namespace: monitoring-demo
data:
  ENVIRONMENT: "local"
  LOG_LEVEL: "info"
  APPLICATION_VERSION: "1.0.0"
---
# ============================================================
# Secret
# ============================================================
apiVersion: v1
kind: Secret
metadata:
  name: demo-app-secret
  namespace: monitoring-demo
type: Opaque
stringData:
  USERNAME: "demo-user"
  PASSWORD: "demo-password"
---
# ============================================================
# Deployment
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-api
  namespace: monitoring-demo
  labels:
    app: demo-api
    component: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: demo-api
  template:
    metadata:
      labels:
        app: demo-api
        component: backend
    spec:
      containers:
        - name: api
          image: nginx:1.27
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          envFrom:
            - configMapRef:
                name: demo-app-config
            - secretRef:
                name: demo-app-secret
---
# ============================================================
# Service
# ============================================================
apiVersion: v1
kind: Service
metadata:
  name: demo-api-service
  namespace: monitoring-demo
  labels:
    app: demo-api
    component: networking
spec:
  type: ClusterIP
  selector:
    app: demo-api
  ports:
    - name: http
      port: 80
      targetPort: http
---
# ============================================================
# StatefulSet
# ============================================================
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: demo-database
  namespace: monitoring-demo
  labels:
    app: demo-database
    component: database
spec:
  serviceName: demo-database
  replicas: 2
  selector:
    matchLabels:
      app: demo-database
  template:
    metadata:
      labels:
        app: demo-database
        component: database
    spec:
      containers:
        - name: database
          image: redis:7
          ports:
            - name: redis
              containerPort: 6379
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
# ============================================================
# Headless Service
# ============================================================
apiVersion: v1
kind: Service
metadata:
  name: demo-database
  namespace: monitoring-demo
  labels:
    app: demo-database
    component: networking
spec:
  clusterIP: None
  selector:
    app: demo-database
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
# ============================================================
# DaemonSet
# ============================================================
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: demo-agent
  namespace: monitoring-demo
  labels:
    app: demo-agent
    component: agent
spec:
  selector:
    matchLabels:
      app: demo-agent
  template:
    metadata:
      labels:
        app: demo-agent
        component: agent
    spec:
      containers:
        - name: agent
          image: busybox:1.36
          command: ["/bin/sh", "-c"]
          args:
            - |
              while true; do
                echo "Demo agent running on $(hostname)"
                sleep 30
              done
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
---
# ============================================================
# Job
# ============================================================
apiVersion: batch/v1
kind: Job
metadata:
  name: demo-job
  namespace: monitoring-demo
  labels:
    app: demo-job
    component: batch
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: demo-job
        component: batch
    spec:
      restartPolicy: Never
      containers:
        - name: job
          image: busybox:1.36
          command: ["/bin/sh", "-c"]
          args:
            - |
              echo "Starting demo job..."
              sleep 10
              echo "Demo job completed successfully."
---
# ============================================================
# CronJob
# ============================================================
apiVersion: batch/v1
kind: CronJob
metadata:
  name: demo-cronjob
  namespace: monitoring-demo
  labels:
    app: demo-cronjob
    component: batch
spec:
  schedule: "*/5 * * * *"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: demo-cronjob
            component: batch
        spec:
          restartPolicy: Never
          containers:
            - name: cronjob
              image: busybox:1.36
              command: ["/bin/sh", "-c"]
              args:
                - echo "CronJob executed at $(date)"
---
# ============================================================
# PersistentVolumeClaim
# ============================================================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: demo-storage
  namespace: monitoring-demo
  labels:
    app: demo-database
    component: storage
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
# ============================================================
# ResourceQuota
# ============================================================
apiVersion: v1
kind: ResourceQuota
metadata:
  name: demo-resource-quota
  namespace: monitoring-demo
spec:
  hard:
    pods: "20"
    requests.cpu: "4"
    requests.memory: 4Gi
    limits.cpu: "8"
    limits.memory: 8Gi
---
# ============================================================
# LimitRange
# ============================================================
apiVersion: v1
kind: LimitRange
metadata:
  name: demo-limit-range
  namespace: monitoring-demo
spec:
  limits:
    - type: Container
      default:
        cpu: 500m
        memory: 512Mi
      defaultRequest:
        cpu: 100m
        memory: 128Mi
