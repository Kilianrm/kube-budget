# Story: an over-requested API. It reserves 500m CPU and 1Gi per pod but idles
# at a few millicores, so rightsizing flags it and the freed requests let the
# cluster drop a node. One container per pod, so the plan can give an exact
# kubectl command.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout-api
  namespace: shop
spec:
  replicas: 3
  selector:
    matchLabels:
      app: checkout-api
  template:
    metadata:
      labels:
        app: checkout-api
    spec:
      containers:
        - name: api
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: checkout-api
  namespace: shop
spec:
  selector:
    app: checkout-api
  ports:
    - port: 80
      targetPort: 80
---
# Story: a right-sized service. It keeps its CPU at the request (the limit
# throttles it there) and holds most of its memory, so its efficiency is high
# and the plan leaves it alone.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: recommendation-engine
  namespace: shop
spec:
  replicas: 2
  selector:
    matchLabels:
      app: recommendation-engine
  template:
    metadata:
      labels:
        app: recommendation-engine
    spec:
      containers:
        - name: engine
          image: polinux/stress:1.0.4
          command: ["stress"]
          args: ["--cpu", "1", "--vm", "1", "--vm-bytes", "96M", "--vm-hang", "0"]
          resources:
            requests:
              cpu: 250m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 160Mi
---
# Story: a stateful workload with a mounted volume. Its storage is charged to
# the shop namespace, it is never proposed for spot, and its volume is never
# called an orphan because a running pod mounts it.
apiVersion: v1
kind: Secret
metadata:
  name: orders-db
  namespace: shop
type: Opaque
stringData:
  POSTGRES_PASSWORD: showcase-only-not-a-real-password
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: orders-db
  namespace: shop
spec:
  serviceName: orders-db
  replicas: 1
  selector:
    matchLabels:
      app: orders-db
  template:
    metadata:
      labels:
        app: orders-db
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          envFrom:
            - secretRef:
                name: orders-db
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: showcase-gp3
        resources:
          requests:
            storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: orders-db
  namespace: shop
spec:
  clusterIP: None
  selector:
    app: orders-db
  ports:
    - port: 5432
