# Story: batch work already on spot capacity. The workers tolerate the spot
# group's taint and select it, so the explorer shows a second node group
# priced at the spot rate.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: queue-worker
  namespace: batch
spec:
  replicas: 2
  selector:
    matchLabels:
      app: queue-worker
  template:
    metadata:
      labels:
        app: queue-worker
    spec:
      nodeSelector:
        workload-tier: batch
      tolerations:
        - key: workload-tier
          operator: Equal
          value: batch
          effect: NoSchedule
      containers:
        - name: worker
          image: polinux/stress:1.0.4
          command: ["stress"]
          args: ["--cpu", "1", "--vm", "1", "--vm-bytes", "80M", "--vm-hang", "0"]
          resources:
            requests:
              cpu: 350m
              memory: 128Mi
            limits:
              cpu: 350m
              memory: 160Mi
---
# Short-lived runs: a Job pod is costed only while it runs, and the plan counts
# Jobs as stateless work that could move to spot.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: nightly-report
  namespace: batch
spec:
  schedule: "*/15 * * * *"
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          nodeSelector:
            workload-tier: batch
          tolerations:
            - key: workload-tier
              operator: Equal
              value: batch
              effect: NoSchedule
          containers:
            - name: report
              image: busybox:1.36
              command: ["/bin/sh", "-c", "echo building report; sleep 120; echo done"]
              resources:
                requests:
                  cpu: 100m
                  memory: 64Mi
                limits:
                  memory: 64Mi
